apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-tareas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servicio-tareas
  template:
    metadata:
      labels:
        app: servicio-tareas
    spec:
      containers:
        - name: servicio-tareas
          image: servicio-tareas:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /tareas, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-tareas
spec:
  selector:
    app: servicio-tareas #enruta a los pods con esta etiqueta
  ports:
    - port: 8080
      targetPort: 8080